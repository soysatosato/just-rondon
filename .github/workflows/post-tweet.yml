name: Post scheduled tweet

on:
  schedule:
    # 1日3回、JST 7:30 / 12:00 / 21:00 に下書きキューから1件投稿する。
    - cron: "30 22 * * *" # JST 07:30
    - cron: "0 3 * * *" # JST 12:00
    - cron: "0 12 * * *" # JST 21:00
  workflow_dispatch: {}

jobs:
  post-tweet:
    runs-on: ubuntu-latest
    steps:
      - name: Call post-tweet cron endpoint
        run: |
          curl -sf -X GET "${{ secrets.SITE_URL }}/api/cron/post-tweet" \
            -H "Authorization: Bearer ${{ secrets.CRON_SECRET }}"
